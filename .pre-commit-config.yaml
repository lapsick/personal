# Pre-commit hooks: format + lint + type-check before every commit.
# Install once with: pre-commit install
minimum_pre_commit_version: "3.8.0"
default_language_version:
  python: python3.12

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff-format
      - id: ruff
        args: ["--fix"]

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.11.2
    hooks:
      - id: mypy
        additional_dependencies:
          - django-stubs
        args: ["--config-file=pyproject.toml"]
        # Wagtail/Django models require the app modules on the path; run against
        # the tracked source packages only.
        files: ^(core|home|projects|blog|contact|portfolio)/
        exclude: (migrations/|tests/)
