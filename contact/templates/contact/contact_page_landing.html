{% extends "core/base.html" %}
{% load wagtailcore_tags %}

{% block content %}
<section class="container contact-landing">
  <h1>{{ page.title }}</h1>
  {% if page.thank_you_text %}
    <div class="contact-landing__message" role="status">{{ page.thank_you_text|richtext }}</div>
  {% else %}
    <p role="status">Thank you — your message has been sent.</p>
  {% endif %}
  <p><a class="button button--secondary" href="/">Back to home</a></p>
</section>
{% endblock %}
