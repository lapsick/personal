name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint (ruff format + check)
        run: |
          ruff format --check .
          ruff check .

      - name: Type-check (mypy)
        run: mypy .

      - name: Unit tests (isolated)
        run: pytest -m "not integration"

      - name: Integration tests + combined coverage gate (>= 80%)
        run: pytest -m integration --cov-append --cov-fail-under=80

  accessibility:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          npm install -g pa11y-ci

      - name: Prepare database and seed content
        run: |
          python manage.py migrate
          python manage.py seed_site

      - name: Start server
        run: |
          python manage.py runserver 0.0.0.0:8000 &
          npx wait-on http://localhost:8000/ --timeout 60000

      - name: Run pa11y-ci (axe, WCAG 2.1 AA) across key pages
        run: pa11y-ci --config .pa11yci.json
